<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Innerpage SaaS</title>
  <meta name="description" content="YijiaMango SaaS 穩定入口目錄" />
  <link rel="stylesheet" href="./hub.css" />
</head>
<body>
  <div class="wrap">
    <div class="eyebrow">Innerpage SaaS</div>
    <h1>服務入口目錄</h1>
    <p class="lead">
      固定網址不變；每個應用各自一支 <code>app/&lt;名稱&gt;</code> 分支。
      更新實際部署位址時，只改該分支的 <code>redirect.config.js</code>。
    </p>
    <div id="status" class="empty">載入中…</div>
    <div class="grid" id="apps"></div>
    <footer>
      Hub: <code>https://yijiamango.github.io/Innerpage_SaaS/</code><br />
      應用: <code>…/&lt;名稱&gt;/</code>
    </footer>
  </div>
  <script src="./hub.js"></script>
</body>
</html>
