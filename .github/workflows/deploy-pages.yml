name: Deploy Pages

on:
  push:
    branches:
      - main
      - "app/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch all app/* branches
        run: |
          git fetch origin --prune
          git fetch origin '+refs/heads/app/*:refs/remotes/origin/app/*' || true
          git branch -r --list 'origin/app/*'

      - name: Build site from app/* branches
        run: |
          chmod +x scripts/build-pages.sh
          ./scripts/build-pages.sh

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
